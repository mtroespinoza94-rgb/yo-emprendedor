<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yo Emprendedor</title>
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;}
  body{font-family:system-ui,sans-serif;background:#faf8f4;color:#1e211c;
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border:1px solid #ddd6c7;border-radius:14px;padding:2rem;
    max-width:420px;width:100%;text-align:center;}
  h1{color:#1f6f5c;margin-top:0;}
  button{font:inherit;font-weight:600;padding:.8rem 1.4rem;border-radius:8px;border:none;
    cursor:pointer;background:#1f6f5c;color:#fff;width:100%;margin-top:1rem;}
  button:disabled{opacity:.5;cursor:default;}
  #estado{margin-top:1rem;font-size:.9rem;color:#5a5f55;}
  #panel-usuario{display:none;text-align:left;}
  #panel-usuario code{background:#f1ede4;padding:.1em .4em;border-radius:4px;}
</style>
</head>
<body>
  <div class="card">
    <h1>Yo Emprendedor</h1>

    <div id="panel-login">
      <p>Inicia sesión con tu cuenta de Google para continuar.</p>
      <button id="btn-google">Iniciar sesión con Google</button>
    </div>

    <div id="panel-usuario">
      <p>Sesión iniciada como <strong id="txt-nombre"></strong> (<span id="txt-correo"></span>)</p>
      <p>Tu código de referido: <code id="txt-codigo"></code></p>
      <p>Plan actual: <span id="txt-plan"></span></p>
      <button id="btn-logout">Cerrar sesión</button>
    </div>

    <div id="estado"></div>
  </div>

  <!-- Firebase (SDK compat, vía CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- Lógica de la app, en su propio archivo (no "inline") para que la
       política de seguridad del sitio (Content-Security-Policy en
       netlify.toml) pueda permitirlo sin tener que abrir la puerta a
       cualquier script inline, que es justo lo que esa política busca
       evitar. -->
  <script src="app.js"></script>
</body>
</html>
